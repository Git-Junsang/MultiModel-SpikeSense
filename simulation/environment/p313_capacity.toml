# P3.13 논문 실험(옛 paper_exp.py --part capacity)
# L·64 lane, membrane potential DDR3, rev 4, 예약 25.5 tile, 입출력 즉시 전송, spike 2개/cycle
# 그림 5: 트랙 수 × 연산(dense, spike 1·2개/cycle) × offset 배정 끔/켬
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 2
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["S", "U"]
seeds = 5
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
tracks = [512, 768, 1024, 1152, 1280, 1408, 1536]
compute_mode = [
  {label = "dense", spk = 0},
  {label = "spike 1개/cycle", spk = 1},
  {label = "spike 2개/cycle", spk = 2},
]
offset_assign = [
  {label = "offset 배정 끔", offset = "none", storage = "A", entries = 10},
  {label = "offset 배정 켬"},
]
