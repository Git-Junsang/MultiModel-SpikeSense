# P3.21 비교: jitter가 커질 때 SW만(Host offset 배정 + LRU)과 SW+HW(Host offset 배정 + offset-order cache). entry 4·10
# L·64 lane, rev 4, 예약 25.5 tile, 즉시 입출력, spike 2개/cycle, 남는 BRAM에 12 bit membrane potential, Grouping
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.10
bw_mbps = 3015.0
spk = 2
bits = 12
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 10
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
method = [
  {label = "SW만: Host offset 배정", storage = "A"},
  {label = "SW+HW: 제안", storage = "G"},
]
entries = [4, 10]
jitter_ms = [0.8, 1.6, 3.2, 6.4, 10.0, 15.0, 20.0]
