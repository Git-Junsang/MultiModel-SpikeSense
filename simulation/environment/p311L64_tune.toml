# P3.11 공통 조정: 조절값이 있는 scheduler마다 조정 seed 100~104 × 시나리오 6 × 악조건 5에서 모두 miss 0인 값 중
# weight byte가 가장 작은 값(옛 target_exp.py --stage tune2 --prefix p311L64). 고른 값을 p311L64_margin에 옮긴다
# L·64 lane, Host 1 ms batch 입출력, dense 연산
# 키 설명은 template.toml

mode = "tune"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 0
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 1.0
result_push = false
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 5
seed0 = 100
warm = 16
meas = 64
storage = "G"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = [{label = "기준"}, {label = "Host 주기 2 ms (guard가 앎)", host_ms = 2.0}, {label = "PCIe 꼬리 +700 µs (guard가 모름)", tail_us = 700.0}, {label = "제어 비용 20 %", ovh = 1.2}, {label = "DDR3 2.0 GB/s", bw_mbps = 2000.0}]

[sweep]
design = [
  {label = "A · 한번에", storage = "A", compute = "all"},
  {label = "A · 한줄씩", storage = "A", compute = "row"},
  {label = "D · 한줄씩", storage = "D", compute = "row"},
]
scheduler = [
  {label = "timeout", sched = "timeout", tune_attr = "W", tune_values = [1000.0, 2000.0, 3000.0, 4000.0, 5000.0, 6000.0, 7000.0, 8000.0, 9000.0, 10000.0, 11000.0, 12000.0, 13000.0, 14000.0, 15000.0, 16000.0, 17000.0, 18000.0, 19000.0, 20000.0, 21000.0, 22000.0, 23000.0, 24000.0, 25000.0, 26000.0, 27000.0, 28000.0, 29000.0, 30000.0, 31000.0]},
  {label = "dysta", sched = "dysta", tune_attr = "eta", tune_values = [0.0, 0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 10.0]},
  {label = "clockwork", sched = "clockwork", tune_attr = "variant", tune_values = ["A", "B"]},
  {label = "symphony", sched = "symphony", tune_attr = "slack", tune_values = [0.0, 1000.0, 2000.0, 4000.0, 8000.0, 12000.0, 16000.0, 20000.0, 24000.0, 26000.0, 28000.0, 30000.0]},
  {label = "deeprt", sched = "deeprt", tune_attr = "cfg", tune_values = [[2000.0, true], [4000.0, true], [8000.0, true], [12000.0, true], [14900.0, true], [2000.0, false], [4000.0, false], [8000.0, false], [12000.0, false], [14900.0, false]]},
  {label = "slackbatch_lite", sched = "slackbatch_lite", tune_attr = "slack_ratio", tune_values = [0.0, 0.05078125, 0.1015625, 0.1484375, 0.19921875, 0.30078125, 0.3984375, 0.5]},
  {label = "slackbatch", sched = "slackbatch", tune_attr = "slack_ratio", tune_values = [0.0, 0.05078125, 0.1015625, 0.1484375, 0.19921875, 0.30078125, 0.3984375, 0.5]},
]
