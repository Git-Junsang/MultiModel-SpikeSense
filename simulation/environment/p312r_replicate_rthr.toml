tracks = 1024
host_ms = 0.0
result_push = true
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 5
seed0 = 0
warm = 16
meas = 64
storage = "R"
entries = 0
storage_attrs = {}
compute = "wide"
sched = "wspt_rep"
