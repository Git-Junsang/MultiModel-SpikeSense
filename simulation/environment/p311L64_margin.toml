# P3.11 공정 비교 L·64 lane, membrane potential DDR3, rev 4, 예약 25.5 tile, Host 1 ms batch 입출력, dense 연산(옛 target_exp.py --prefix p311L64)
# 조절값 = p311L64_tune 결과(옛 p311L64_tuned_n1024.json)
# 1,024트랙 지표(cond 기준)와 악조건. 옛 p311L64_fixed_n1024는 기준 행이다
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 0
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 1.0
result_push = false
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 20
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

