# P3.12 평균 응답 시간 단축의 악조건: 0단계(기준)와 6단계(제안)(옛 latency_exp.py)
# L·64 lane, membrane potential DDR3, rev 4, 예약 25.5 tile, 1,024트랙, entry 수 = BRAM 예산 최대
# guard는 꼬리 지연을 모른다
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 2
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 20
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
row = [
  {label = "0 기준: Clockwork Method, dense, Host 1 ms batch", storage = "A", sched = "clockwork", sched_attrs = {variant = "A"}, spk = 0, host_ms = 1.0, result_push = false},
  {label = "6 + WSPT (제안)", storage = "G", sched = "wspt"},
]
cond = [
  {label = "꼬리 +700 µs", tail_us = 700.0},
  {label = "제어 비용 20 %", ovh = 1.2},
  {label = "DDR3 2.0 GB/s", bw_mbps = 2000.0},
  {label = "spike 전부 1 (dense)", spk = 0},
]
