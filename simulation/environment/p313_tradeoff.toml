# P3.13 논문 실험(옛 paper_exp.py --part tradeoff)
# L·64 lane, membrane potential DDR3, rev 4, 예약 25.5 tile, 입출력 즉시 전송, spike 2개/cycle
# 그림 6: BRAM 배분. weight entry × membrane potential bit × jitter. 남는 BRAM에 들어가는 트랙만 membrane potential on-chip
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 2
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 10
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
jitter_ms = [0.8, 1.6, 3.2]
bits = [16, 12]
entries = [2, 3, 4, 5, 6, 8, 10]
