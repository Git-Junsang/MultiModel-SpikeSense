# P3.11 DDR 대역폭 하한: miss 0인 가장 낮은 대역폭(옛 bw_sweep.py, L·64). A · 한번에, seed 0~2
# 옛 스크립트는 대역폭마다 다른 조절값도 시험했다(정책에 유리하게). 여기서는 조절값 고정
# 키 설명은 template.toml

mode = "search"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 0
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 1.0
result_push = false
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 3
seed0 = 0
warm = 16
meas = 64
storage = "A"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "bw_mbps"
search_values = [3015.0, 2400.0, 2000.0, 1600.0, 1300.0, 1000.0, 800.0, 650.0, 500.0, 400.0, 300.0, 250.0, 200.0, 150.0, 100.0]
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
scheduler = [
  {label = "grouping", sched = "grouping", sched_attrs = {}},
  {label = "dysta", sched = "dysta", sched_attrs = {eta = 0.0001}},
  {label = "timeout", sched = "timeout", sched_attrs = {W = 5000.0}},
  {label = "clockwork", sched = "clockwork", sched_attrs = {variant = "A"}},
  {label = "symphony", sched = "symphony", sched_attrs = {slack = 26000.0}},
  {label = "shepherd", sched = "shepherd", sched_attrs = {}},
  {label = "deeprt", sched = "deeprt", sched_attrs = {cfg = [14900.0, false]}},
  {label = "slackbatch_lite", sched = "slackbatch_lite", sched_attrs = {slack_ratio = 0.0}},
  {label = "slackbatch", sched = "slackbatch", sched_attrs = {slack_ratio = 0.0}},
]
