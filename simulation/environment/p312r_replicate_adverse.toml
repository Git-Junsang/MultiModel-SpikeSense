# P3.12 후속: R.복제(제안, 미채택) × 넓게 읽기 × scheduler, WSPT 적재 대기 수정(옛 replicate_exp.py)
# L·64 lane, membrane potential DDR3, rev 4, 예약 25.5 tile, 1,024트랙, entry 수 = BRAM 예산 최대
# R.복제 R = 5, THR = 8
# 악조건
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 2
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 20
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
design = [
  {label = "R · dysta · wide", storage = "R", sched = "dysta", compute = "wide", sched_attrs = {eta = 0.0001}},
  {label = "R · wspt_rep · wide", storage = "R", sched = "wspt_rep", compute = "wide", sched_attrs = {}},
]
cond = [
  {label = "꼬리 +700 µs", tail_us = 700.0},
  {label = "제어 비용 20 %", ovh = 1.2},
  {label = "DDR3 2.0 GB/s", bw_mbps = 2000.0},
  {label = "spike 전부 1 (dense)", spk = 0},
]
