# P3.21 확장: 방법별로 miss 0을 지키는 최대 트랙 수(search, seed 0~2). spike 2개/cycle과 모든 입력 spike(dense)
# L·64 lane @100 MHz, rev 4, 예약 25.5 tile, 즉시 입출력, entry 4, 남는 BRAM에 12 bit membrane potential, jitter 0.8 ms. 같은 BRAM·trace
# 요청 표·송수신 buffer BRAM, Host 계산, Ethernet 대역폭은 트랙 수에 맞춰 늘리지 않았다
# 키 설명은 template.toml

mode = "search"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.10
bw_mbps = 3015.0
spk = 2
bits = 12
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 3
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = [1024, 1536, 2048, 2560, 3072, 3584, 4096, 4608, 5120, 6144]
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
method = [
  {label = "Grouping(offset 배정 없음)", offset = "none", storage = "A", sched = "grouping"},
  {label = "Dysta Method", offset = "none", storage = "A", sched = "dysta", sched_attrs = {eta = 0.0001}},
  {label = "DeepRT Method", offset = "none", storage = "A", sched = "deeprt", sched_attrs = {cfg = [14900.0, false]}},
  {label = "SW+HW: 제안", offset = "model", storage = "G", sched = "grouping"},
]
compute_mode = [{label = "spike 2개/cycle", spk = 2}, {label = "모든 입력 spike(dense)", spk = 0}]
