# P3.8 설계 공간 탐색 rev 2: 설계마다 모든 시나리오 miss 0인 최대 트랙(옛 dse.py --rev 2)
# L, Host 1 ms batch 입출력, dense 연산, 예약 0, seed 3, 16트랙 단위. 탐색 순서는 target_exp 방식(옛 dse는 연산 한계에서 이분 탐색)
# 키 설명은 template.toml

mode = "search"
