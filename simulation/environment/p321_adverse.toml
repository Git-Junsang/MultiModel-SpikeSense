# P3.21 악조건 겹침: offset 배정 없음(Grouping)·Dysta Method·DeepRT Method와 제안을 악조건 여러 개를 겹치고 외부 지연을 더해 비교. entry 4, 1,024트랙
# 외부 지연 = Host·오디오 쪽이 32 ms에서 먼저 쓰는 시간. tail_us를 입력·결과에 각각 더하므로 외부 지연 = 2 × tail_us
# L·64 lane, rev 4, 예약 25.5 tile, 남는 BRAM에 12 bit membrane potential, jitter 0.8 ms
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.10
bw_mbps = 3015.0
spk = 2
bits = 12
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 10
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
method = [
  {label = "Grouping(offset 배정 없음)", offset = "none", storage = "A", sched = "grouping"},
  {label = "Dysta Method", offset = "none", storage = "A", sched = "dysta", sched_attrs = {eta = 0.0001}},
  {label = "DeepRT Method", offset = "none", storage = "A", sched = "deeprt", sched_attrs = {cfg = [14900.0, false]}},
  {label = "SW+HW: 제안", offset = "model", storage = "G", sched = "grouping"},
]
cond = [
  {label = "기준"},
  {label = "dense", spk = 0},
  {label = "dense + 제어 20 % + DDR3 2.0 GB/s", spk = 0, ovh = 1.2, bw_mbps = 2000.0},
  {label = "dense + 제어 20 % + DDR3 2.0 GB/s + 외부 5 ms", spk = 0, ovh = 1.2, bw_mbps = 2000.0, tail_us = 2500.0},
  {label = "dense + 제어 20 % + DDR3 2.0 GB/s + 외부 10 ms", spk = 0, ovh = 1.2, bw_mbps = 2000.0, tail_us = 5000.0},
  {label = "dense + 제어 20 % + DDR3 2.0 GB/s + 외부 15 ms", spk = 0, ovh = 1.2, bw_mbps = 2000.0, tail_us = 7500.0},
  {label = "dense + 제어 20 % + DDR3 2.0 GB/s + 외부 20 ms", spk = 0, ovh = 1.2, bw_mbps = 2000.0, tail_us = 10000.0},
]
