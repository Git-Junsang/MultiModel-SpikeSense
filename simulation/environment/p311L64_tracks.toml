# P3.11 트랙 수 sweep(옛 target_exp.py --prefix p311sw). 설계 3개 × scheduler 6개, seed 10
# L·64 lane, Host 1 ms batch 입출력, dense 연산
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.1
bw_mbps = 3015.0
spk = 0
bits = 0
mem_place = "avg"
tracks = 1024
host_ms = 1.0
result_push = false
offset = "none"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 10
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 0
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
tracks = [512, 768, 1152, 1280, 1360, 1424]
design = [
  {label = "A · 한번에", storage = "A", compute = "all"},
  {label = "F · 한번에", storage = "F", compute = "all"},
  {label = "B · 한줄씩", storage = "B", compute = "row"},
]
scheduler = [
  {label = "grouping", sched = "grouping", sched_attrs = {}},
  {label = "dysta", sched = "dysta", sched_attrs = {eta = 0.0001}},
  {label = "timeout", sched = "timeout", sched_attrs = {W = 5000.0}},
  {label = "deeprt", sched = "deeprt", sched_attrs = {cfg = [14900.0, false]}},
  {label = "slackbatch_lite", sched = "slackbatch_lite", sched_attrs = {slack_ratio = 0.0}},
  {label = "slackbatch", sched = "slackbatch", sched_attrs = {slack_ratio = 0.0}},
]
