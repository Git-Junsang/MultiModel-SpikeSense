# P3.22 deadline = 마이크 수음 시각 + 32 ms. 외부 지연(오디오 buffer·전처리) pre_us를 입력에 더해 방법별 deadline miss를 본다
# 방법: Grouping·Dysta Method·SlackBatch(offset 배정 없음, LRU)와 제안. 조건: 기준, 악조건 겹침(dense + 제어 20 % + DDR3 2.0 GB/s) × 외부 지연 0~20 ms
# L·64 lane, rev 4, 예약 25.5 tile, 남는 BRAM에 12 bit membrane potential, entry 4, jitter 0.8 ms, 1,024트랙, seed 10
# 키 설명은 template.toml

mode = "run"
model = "L"
lanes = 64
mem = "ddr"
rev = 4
reserve = 25.5
ovh = 1.10
bw_mbps = 3015.0
spk = 2
bits = 12
mem_place = "avg"
tracks = 1024
host_ms = 0.0
result_push = true
offset = "model"
jitter_ms = 0.8
gather_ms = 0.0
perturb = ""
tail_us = 0.0
pre_us = 0.0
scenarios = ["U", "K", "S", "I", "SK", "R"]
seeds = 10
seed0 = 0
warm = 16
meas = 64
storage = "G"
entries = 4
storage_attrs = {}
compute = "all"
sched = "grouping"
sched_attrs = {}
search_key = "tracks"
search_values = []
search_step = 16
tune_attr = ""
tune_values = []
tune_conds = []

[sweep]
method = [
  {label = "Grouping(offset 배정 없음)", offset = "none", storage = "A", sched = "grouping"},
  {label = "Dysta Method", offset = "none", storage = "A", sched = "dysta", sched_attrs = {eta = 0.0001}},
  {label = "SlackBatch", offset = "none", storage = "A", sched = "slackbatch"},
  {label = "SW+HW: 제안", sched = "grouping"},
]
cond = [
  {label = "기준"},
  {label = "악조건 겹침", spk = 0, ovh = 1.2, bw_mbps = 2000.0},
]
pre_us = [0.0, 5000.0, 10000.0, 15000.0, 20000.0]
